name: Release

# Android kurulum dosyasini (.apk) uretir ve GitHub Release'e ekler.
#
# Neden EAS degil: EAS Build bir Expo hesabi ister. Buradaki akis tamamen
# GitHub'in ucretsiz runner'inda calisir, hicbir hesap veya secret gerektirmez.
# Expo'nun Android sablonu release derlemesini debug.keystore ile imzaladigi
# icin cikan APK dogrudan kurulabilir (bkz. android/app/build.gradle).
#
# iOS icin ayri bir akis var: .github/workflows/ios-ipa.yml
# O da GitHub'in macOS runner'inda imzasiz bir .ipa uretiyor; imzalama
# telefonda SideStore/AltStore tarafindan yapiliyor.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release etiketi (ornek: v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Etiketi belirle
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=adam-asmaca-$TAG.apk" >> "$GITHUB_OUTPUT"

      - name: Node kur
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Bagimliliklar
        run: npm ci

      - name: Native Android projesini uret
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'

      # x86/x86_64 sadece emulator icin gerekir; gercek tabletler ARM.
      # Ikisini birden atmak APK'yi kabaca yariya indiriyor. armeabi-v7a
      # eski 32-bit tabletler icin duruyor.
      - name: Derle
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - name: APK'yi dist/ altina al
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/${{ steps.meta.outputs.apk }}"
          ls -lh dist/

      # Etiket olmadan da (workflow_dispatch) indirilebilsin diye.
      - name: Derleme ciktisini yukle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.apk }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Release notunu hazirla
        run: |
          cat > release-notes.md <<'EOF'
          ## Kurulum

          **Android tablet:** Aşağıdaki `.apk` dosyasını tablete indirin.
          Ayarlar'da "bilinmeyen kaynaklardan kurulum"a izin verip dosyayı açın.

          **iPad:** Aşağıdaki imzasız `.ipa` dosyasını **SideStore** veya
          **AltStore** ile yükleyin; imzalama telefonda kendi Apple ID'nizle
          yapılır. Ücretsiz Apple ID kullanıyorsanız imzanın 7 günde bir
          yenilenmesi gerekir.

          Alternatif olarak depoyu klonlayıp `npm start` çalıştırın ve QR kodu
          **Expo Go** ile okutun.
          EOF

      - name: Release olustur ve APK'yi ekle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK: dist/${{ steps.meta.outputs.apk }}
        # GitHub API arada 503 donuyor ve tek deneme artifact'i kaybettiriyor.
        # Tekrar deneme ayni zamanda iki akisin ayni anda release olusturma
        # yarisini da cozuyor: ikinci denemede release var, upload'a duser.
        run: |
          publish() {
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$APK" --clobber
            else
              gh release create "$TAG" "$APK" \
                --title "Adam Asmaca $TAG" \
                --notes-file release-notes.md
            fi
          }
          for i in 1 2 3 4 5; do
            if publish; then echo "yayinlandi (deneme $i)"; exit 0; fi
            echo "deneme $i basarisiz, $((i * 15)) sn bekleniyor"
            sleep $((i * 15))
          done
          echo "::error::release'e eklenemedi"
          exit 1
