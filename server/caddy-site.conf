
# --- Ada'nin Adam Asmaca Oyunu: liderlik tablosu -------------------------
# Ayri compose projesi (/opt/ada-liderlik), ayni ic agda "ada-api" takma
# adiyla duruyor. Hicbir port yayinlamiyor; disariya yalnizca buradan aciliyor.
#
# Bu blok /opt/orbitcloud/deploy/Caddyfile dosyasinin sonuna eklenir.
# Mevcut {$DOMAIN} blogu degistirilmez.
ada.152.53.224.34.sslip.io {
    encode gzip

    header {
        Strict-Transport-Security "max-age=63072000"
        X-Content-Type-Options "nosniff"
        Referrer-Policy "no-referrer"
        -Server
    }

    log {
        output stdout
        format console
    }

    reverse_proxy ada-api:8080
}
